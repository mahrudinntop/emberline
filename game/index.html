<!doctype html>
<html lang="en">
<head>
<!-- index.html — hand-authored for this entry. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberline — Keeper of the Dying Fires</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>

<div id="hud" aria-hidden="true">
  <div class="panel" id="panel-fires">
    <span class="tag">Fires</span>
    <div id="fire-pips"></div>
  </div>
  <div class="panel" id="panel-wick">
    <span class="tag">Wick</span>
    <div id="wick-track"><div id="wick-fill"></div></div>
  </div>
  <div class="panel" id="panel-clock">
    <span class="tag">Night</span>
    <span id="clock-value">00:00</span>
  </div>
</div>

<div id="banner" class="hidden">
  <h1 id="banner-title">Emberline</h1>
  <p id="banner-sub">Carry the ember. Keep the fires.</p>
  <p id="banner-keys">WASD move &nbsp;·&nbsp; hold mouse to raise the lantern &nbsp;·&nbsp; Space to set the ember &nbsp;·&nbsp; R restart &nbsp;·&nbsp; Enter begin</p>
  <p id="banner-tip">Dark takes a fire in nine seconds. Your lantern holds it back.</p>
</div>

<p id="status" role="status" aria-live="polite"></p>

<script type="module" src="./src/main.js"></script>
</body>
</html>
